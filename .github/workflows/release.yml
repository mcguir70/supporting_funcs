name: release

on:
  push:
    tags: ["v*"]

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CHANGELOG=$(grep -m1 -oP '^## \[v?\K\d+\.\d+\.\d+' CHANGELOG.md)
          if [ "$TAG" != "$CHANGELOG" ]; then
            echo "Tag $TAG != changelog $CHANGELOG"
            exit 1
          fi