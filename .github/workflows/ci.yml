name: ci

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest