[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "supporting_funcs"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "pint",
    "numpy",
    "scipy",
    "matplotlib",
    "ussa1976",
    "CoolProp",
    "CEA-Wrap",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/supporting_funcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: sweeps many Mach numbers or gammas",
]
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["src/supporting_funcs"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["N812", "UP040"]